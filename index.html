  const g = surfaceAt(P.x, P.z);
  P.feetY = isFinite(g) ? g : 0;
  P.vx = 0; P.vz = 0; P.vy = 0; P.kbX = 0; P.kbZ = 0;
  P.onGround = true;
  P.peakY = P.feetY;
  P.px = P.x; P.pz = P.z; P.pFeet = P.feetY;
  P.yaw = Math.atan2(-(0 - P.x), -(0 - P.z));
  P.pitch = 0;
  P.eye = PC.eyeStand;
  P.bobT = 0; P.bobY = 0; P.stepAcc = 0;
  P.recoil = 0; P.recoilYaw = 0;
  P.hull = PC.hull;
  P.shield = PC.shield;
  P.hurtT = 0; P.hurtAmt = 0; P.dirT = 0;
  P.fov = opts.fov;
  P.aim = false; P.crouch = false; P.sprint = false;
  stats.shots = 0; stats.hits = 0; stats.kills = 0; stats.time = 0; stats.wave = 0; stats.score = 0;
  combo.streak = 0; combo.timer = 0; combo.mult = 1;
  resetWeapons();
  resetEnemies();
  resetPickups();
  resetEffects();
  W.n = 0;
  W.state = 'break';
  W.timer = CONFIG.waves.breakTime;
  W.spawnT = 0;
  W.spawnIdx = 0;
  W.queue.titan = 0; W.queue.tank = 0; W.queue.sentinel = 0; W.queue.drone = 0; W.queue.agent = 0;
  $('killfeed').textContent = '';
  hudCache.score = -1;
  hudCache.wave = '';
  hudCache.boss = -1;
  $('banner').classList.remove('on');
  $('toast').classList.remove('on');
  toastT = 0; bannerT = 0; flashT = 0;
}
function resetEffects() {
  pLife.fill(0);
  shLife.fill(0);
  for (let k = 0; k < PART_N; k++) partInst.setMatrixAt(k, zeroMatrix);
  for (let k = 0; k < SHELL_N; k++) shellInst.setMatrixAt(k, zeroMatrix);
  for (let k = 0; k < DECAL_N; k++) decalInst.setMatrixAt(k, zeroMatrix);
  partInst.instanceMatrix.needsUpdate = true;
  shellInst.instanceMatrix.needsUpdate = true;
  decalInst.instanceMatrix.needsUpdate = true;
  for (const s of shocks) { s.life = 0; s.mesh.visible = false; }
  for (const p of projPool) killProjectile(p);
}
function startGame() {
  ensureAudio();
  loadMap();
  resetRun();
  mode = MODE.PLAY;
  showScreen(null);
  setHudVisible(true);
  requestLock();
}
function pauseGame() {
  if (mode !== MODE.PLAY) return;
  mode = MODE.PAUSE;
  clearInput();
  showScreen('menu-pause');
  setHudVisible(false);
  if (document.pointerLockElement) document.exitPointerLock();
}
function resumeGame() {
  if (mode !== MODE.PAUSE) return;
  mode = MODE.PLAY;
  clearInput();
  showScreen(null);
  setHudVisible(true);
  requestLock();
}
function goMenu() {
  if (document.pointerLockElement) document.exitPointerLock();
  mode = MODE.MENU;
  clearInput();
  resetRun();
  for (const g of vm.models) g.visible = false;
  setHudVisible(false);
  showScreen('menu-main');
}
function endGame() {
  if (mode === MODE.DEAD) return;
  mode = MODE.DEAD;
  clearInput();
  if (document.pointerLockElement) document.exitPointerLock();
  const score = Math.floor(stats.score);
  const isRecord = score > best && score > 0;
  if (score > best) best = score;
  saveState();
  const secs = Math.floor(stats.time);
  $('end-score').textContent = score;
  $('end-wave').textContent = stats.wave;
  $('end-time').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  $('end-kills').textContent = stats.kills;
  $('end-acc').textContent = (stats.shots ? Math.round((stats.hits / stats.shots) * 100) : 0) + ' %';
  $('end-record').classList.toggle('hidden', !isRecord);
  setHudVisible(false);
  showScreen('menu-end');
}
function openOptions() {
  $('opt-sens').value = opts.sens;
  $('opt-invert').checked = opts.invert;
  $('opt-music').value = opts.music;
  $('opt-sfx').value = opts.sfx;
  $('opt-fov').value = opts.fov;
  $('opt-fps').checked = opts.fps;
  $('opt-shadows').value = String(opts.shadows);
  $('opt-bloom').checked = opts.bloom;
  refreshOptionLabels();
}
function refreshOptionLabels() {
  $('out-sens').textContent = Number(opts.sens).toFixed(1);
  $('out-music').textContent = Math.round(opts.music * 100) + ' %';
  $('out-sfx').textContent = Math.round(opts.sfx * 100) + ' %';
  $('out-fov').textContent = opts.fov + '°';
}
/* Options appliquées immédiatement */
function applyOptionsFromUi() {
  opts.sens = Number($('opt-sens').value);
  opts.invert = $('opt-invert').checked;
  opts.music = Number($('opt-music').value);
  opts.sfx = Number($('opt-sfx').value);
  opts.fov = Number($('opt-fov').value);
  opts.fps = $('opt-fps').checked;
  opts.shadows = Number($('opt-shadows').value);
  opts.bloom = $('opt-bloom').checked;
  refreshOptionLabels();
  applyVolumes();
  applyShadowOption();
  $('fps').classList.toggle('hidden', !(opts.fps && mode === MODE.PLAY));
  saveState();
}
function updateBestLine() {
  $('best-big').textContent = Math.floor(best);
}
function handleAction(action) {
  if (action === 'play') startGame();
  else if (action === 'options') {
    optionsReturn = mode === MODE.PAUSE ? 'menu-pause' : 'menu-main';
    openOptions();
    showScreen('menu-options');
  } else if (action === 'best') {
    updateBestLine();
    showScreen('menu-best');
  } else if (action === 'back') {
    if (!$('menu-best').classList.contains('hidden')) showScreen('menu-main');
    else showScreen(optionsReturn);
  } else if (action === 'resume') resumeGame();
  else if (action === 'menu') goMenu();
}

/* ================= Boucle principale ================= */
/* Position rendue des robots, lissée entre deux pas de simulation */
function interpolateEnemies(a) {
  for (const e of enemies) {
    if (!e.alive || !e.root.visible) continue;
    e.root.position.set(lerp(e.px, e.x, a), lerp(e.pFeet, e.feetY, a) + e.hoverY, lerp(e.pz, e.z, a));
  }
}
function updateEnemies(dt) {
  for (const e of enemies) updateEnemy(e, dt);
}
function updateEffects(dt) {
  updateParticles(dt);
  updateShells(dt);
  updateShocks(dt);
}
function step(dt) {
  stats.time += dt;
  player.px = player.x; player.pz = player.z; player.pFeet = player.feetY;
  for (const e of enemies) { e.px = e.x; e.pz = e.z; e.pFeet = e.feetY; }
  updatePlayer(dt);
  updateWeapons(dt);
  updateWaves(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updatePickups(dt);
  updateEffects(dt);
  if (combo.timer > 0) {
    combo.timer -= dt;
    if (combo.timer <= 0) {
      combo.streak = 0;
      combo.mult = 1;
    }
  }
}
function render() {
  if (opts.bloom && composer) composer.render();
  else renderer.render(scene, camera);
}
function updateMenuCamera(dt) {
  menuYaw += dt * 0.12;
  camera.position.set(spawns.player.x, surfaceAt(spawns.player.x, spawns.player.z) + PC.eyeStand, spawns.player.z);
  camera.rotation.set(-0.04 + Math.sin(menuYaw * 0.7) * 0.03, menuYaw, 0);
}
let menuYaw = 0;
let lastT = 0, acc = 0, minimapT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > CONFIG.loop.maxDelta) dt = CONFIG.loop.maxDelta;
  fpsFrames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fpsValue = Math.round(fpsFrames / fpsTimer);
    fpsFrames = 0;
    fpsTimer = 0;
  }
  if (mode === MODE.PLAY) {
    acc += dt;
    while (acc >= CONFIG.loop.step) {
      acc -= CONFIG.loop.step;
      step(CONFIG.loop.step);
    }
    const alpha = acc / CONFIG.loop.step;
    updateCamera(dt, alpha);
    interpolateEnemies(alpha);
    animateDecor(dt);
  } else if (mode === MODE.MENU) {
    updateMenuCamera(dt);
    animateDecor(dt);
    updateEffects(dt);
  } else {
    acc = 0;
    updateCamera(0);
  }
  updateHUD(mode === MODE.PLAY ? dt : 0);
  minimapT -= dt;
  if (minimapT <= 0 && mode === MODE.PLAY) {
    minimapT = 0.1;
    updateMinimap();
  }
  render();
}

/* ================= Initialisation ================= */
function loadMap() {
  parseMap();
  buildNav();
  buildMapMeshes();
  buildMinimapBase();
}
function bindEvents() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (b) handleAction(b.dataset.action);
  });
  for (const id of ['opt-sens', 'opt-invert', 'opt-music', 'opt-sfx', 'opt-fov', 'opt-fps', 'opt-shadows', 'opt-bloom']) {
    $(id).addEventListener('input', applyOptionsFromUi);
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mouseup', onMouseUp);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('wheel', onWheel, { passive: true });
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('blur', () => { if (mode === MODE.PLAY) pauseGame(); });
  document.addEventListener('pointerlockchange', () => {
    if (!document.pointerLockElement && mode === MODE.PLAY) pauseGame();
  });
  document.addEventListener('pointerlockerror', () => {
    if (mode === MODE.PLAY) pauseGame();
  });
}
function init() {
  loadState();
  initRenderer();
  buildMaterials();
  initGeometry();
  buildSky();
  loadMap();
  initFxMeshes();
  initShocks();
  initProjectiles();
  initPickups();
  createEnemyPool();
  buildViewmodels();
  resetRun();
  for (const g of vm.models) g.visible = false;
  openOptions();
  applyVolumes();
  updateBestLine();
  bindEvents();
  setHudVisible(false);
  $('minimap').classList.remove('hidden');
  showScreen('menu-main');
  mode = MODE.MENU;
  lastT = performance.now();
  requestAnimationFrame(frame);
}
try {
  init();
} catch (err) {
  $('error-text').textContent = 'Initialisation impossible (WebGL ou module three.js indisponible). ' + (err && err.message ? err.message : '');
  showScreen('menu-error');
}
</script>
