<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Station Sigma</title>
<style>
:root{--text:#dfeaff;--dim:#8fa3c4;--cold:#9fd8ff;--orange:#ff8a2a;--red:#ff3b3b;--panel:rgba(7,12,22,.78);--line:rgba(159,216,255,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070d;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{position:absolute}
#fps{left:16px;top:14px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#minimap{left:16px;top:34px;width:180px;height:180px;border:1px solid var(--line);background:rgba(5,9,16,.6)}
#wave-info{left:50%;top:14px;transform:translateX(-50%);text-align:center;min-width:260px}
#wave-text{font-size:18px;font-weight:700;letter-spacing:.08em;text-shadow:0 0 8px #000}
#wave-sub{font-size:14px;color:var(--cold);margin-top:2px;text-shadow:0 0 6px #000}
#enemies-left{font-size:12px;color:var(--dim);margin-top:2px}
#score-box{right:16px;top:14px;text-align:right}
#score{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #000}
#combo{font-size:15px;color:var(--orange);min-height:20px;font-weight:700;text-shadow:0 0 8px #000}
#killfeed{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:8px}
.kf{background:rgba(7,12,22,.72);border-right:3px solid var(--orange);padding:4px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;animation:kfin .18s ease-out}
.kf b{color:var(--cold);font-weight:700}
@keyframes kfin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.kf{animation:none}}
#boss{left:50%;top:86px;transform:translateX(-50%);width:min(520px,70vw);text-align:center}
#boss-name{font-size:13px;letter-spacing:.2em;color:#ff9ef5;margin-bottom:4px;text-shadow:0 0 8px #000}
.bar{position:relative;height:10px;background:rgba(255,255,255,.12);border:1px solid var(--line);overflow:hidden}
.bar>div{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#2d7dff,#9fd8ff);transform-origin:left center}
.bar>div.hull{background:linear-gradient(90deg,#ff7a3d,#ffd23d)}
.bar>div.boss{background:linear-gradient(90deg,#c21bd0,#ff7bf0)}
#status{left:16px;bottom:16px;width:260px}
.bar-row{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--dim)}
.bar-row b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
#ammo-box{right:16px;bottom:16px;text-align:right;width:260px}
#weapon-name{font-size:13px;color:var(--cold);letter-spacing:.06em}
#ammo-val{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 8px #000}
#ammo-val span.res{font-size:18px;color:var(--dim)}
#reload-bar{margin-top:6px;height:6px;opacity:0;transition:opacity .15s}
#reload-bar.on{opacity:1}
#reload-fill{transform:scaleX(0)!important;background:linear-gradient(90deg,#ffd23d,#ff8a2a)!important}
#reticle{left:50%;top:50%;width:0;height:0}
#reticle i{position:absolute;background:var(--text);box-shadow:0 0 3px #000;transition:background .05s}
#reticle .t{width:2px;height:8px;transform:translate(-1px,calc(var(--d,6px) * -1 - 8px))}
#reticle .b{width:2px;height:8px;transform:translate(-1px,var(--d,6px))}
#reticle .l{width:8px;height:2px;transform:translate(calc(var(--d,6px) * -1 - 8px),-1px)}
#reticle .r{width:8px;height:2px;transform:translate(var(--d,6px),-1px)}
#reticle.hit i{background:#ff5555}
#toast{left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--orange);opacity:0;transition:opacity .2s;text-shadow:0 0 8px #000;white-space:nowrap}
#toast.on{opacity:1}
#banner{left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:.12em;color:var(--cold);text-shadow:0 0 18px rgba(159,216,255,.7);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#damage{inset:0;background:radial-gradient(ellipse at center,rgba(255,40,40,0) 42%,rgba(255,30,30,.9) 100%);opacity:0}
#dir{left:50%;top:50%;width:0;height:0;transform:rotate(var(--a,0deg)) translateY(-150px);opacity:0;transition:opacity .3s}
#dir.on{opacity:1}
#dir::after{content:"";position:absolute;left:-13px;top:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:24px solid var(--red);filter:drop-shadow(0 0 6px #ff0000)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:radial-gradient(ellipse at center,rgba(5,9,16,.35) 0%,rgba(3,5,10,.86) 100%);text-align:center;pointer-events:auto}
.screen h1{margin:0;font-size:clamp(40px,8vw,84px);letter-spacing:.2em;font-weight:800;color:var(--cold);text-shadow:0 0 22px rgba(159,216,255,.55)}
.screen h2{margin:0 0 6px;font-size:28px;letter-spacing:.12em;color:var(--cold)}
.screen .sub{color:var(--dim);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);padding:22px 26px;display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(440px,90vw)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;text-align:left;min-width:min(440px,88vw)}
.grid label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.grid input[type=range]{flex:1;max-width:200px;accent-color:var(--orange)}
.grid output{width:52px;text-align:right;color:var(--cold);font-variant-numeric:tabular-nums}
select{background:#0b1220;color:var(--text);border:1px solid var(--line);padding:4px 8px;font:inherit}
button{font:inherit;font-size:17px;letter-spacing:.08em;min-width:240px;padding:12px 22px;color:var(--text);background:rgba(20,34,58,.85);border:1px solid var(--line);cursor:pointer;transition:background .15s,border-color .15s}
button:hover,button:focus-visible{background:rgba(45,125,255,.35);border-color:var(--cold);outline:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;font-size:16px;color:var(--dim);min-width:min(440px,88vw)}
.stats b{color:var(--text);font-variant-numeric:tabular-nums;float:right}
.record{color:var(--orange);font-size:22px;font-weight:800;letter-spacing:.1em;margin:0;text-shadow:0 0 12px rgba(255,138,42,.6)}
.big{font-size:56px;font-weight:800;color:var(--cold);margin:0;font-variant-numeric:tabular-nums}
#error-text{color:var(--dim);max-width:560px;line-height:1.5}
</style>

<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="fps" class="hidden">FPS 0</div>
  <canvas id="minimap" width="180" height="180" class="hidden"></canvas>
  <div id="wave-info">
    <div id="wave-text">VAGUE 0</div>
    <div id="wave-sub"></div>
    <div id="enemies-left"></div>
  </div>
  <div id="score-box">
    <div id="score">0</div>
    <div id="combo"></div>
    <div id="killfeed"></div>
  </div>
  <div id="boss" class="hidden">
    <div id="boss-name">TITAN</div>
    <div class="bar"><div id="boss-fill" class="boss"></div></div>
  </div>
  <div id="status">
    <div class="bar-row"><span>BOUCLIER</span><div class="bar"><div id="shield-fill"></div></div><b id="shield-val">100</b></div>
    <div class="bar-row"><span>COQUE</span><div class="bar"><div id="hull-fill" class="hull"></div></div><b id="hull-val">100</b></div>
  </div>
  <div id="ammo-box">
    <div id="weapon-name"></div>
    <div id="ammo-val"><span id="mag">0</span> <span class="res">/ <span id="reserve">0</span></span></div>
    <div id="reload-bar" class="bar"><div id="reload-fill"></div></div>
  </div>
  <div id="reticle"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="damage"></div>
  <div id="dir"></div>
</div>

<section id="menu-main" class="screen hidden">
  <h1>STATION SIGMA</h1>
  <p class="sub">Une station abandonnée. Des robots. Aucune retraite.</p>
  <button data-action="play">Jouer</button>
  <button data-action="options">Options</button>
  <button data-action="best">Meilleur score</button>
</section>

<section id="menu-options" class="screen hidden">
  <div class="panel">
    <h2>Options</h2>
    <div class="grid">
      <label>Sensibilité <span><input id="opt-sens" type="range" min="0.1" max="3" step="0.1"><output id="out-sens"></output></span></label>
      <label>Inverser l'axe vertical <input id="opt-invert" type="checkbox"></label>
      <label>Volume musique <span><input id="opt-music" type="range" min="0" max="1" step="0.05"><output id="out-music"></output></span></label>
      <label>Volume effets <span><input id="opt-sfx" type="range" min="0" max="1" step="0.05"><output id="out-sfx"></output></span></label>
      <label>FOV <span><input id="opt-fov" type="range" min="60" max="100" step="1"><output id="out-fov"></output></span></label>
      <label>Afficher les FPS <input id="opt-fps" type="checkbox"></label>
      <label>Qualité des ombres <select id="opt-shadows"><option value="0">Désactivées</option><option value="1024">Basse</option><option value="2048">Haute</option></select></label>
      <label>Effets lumineux (bloom) <input id="opt-bloom" type="checkbox"></label>
    </div>
  </div>
  <button data-action="back">Retour</button>
</section>

<section id="menu-best" class="screen hidden">
  <h2>Meilleur score</h2>
  <p id="best-big" class="big">0</p>
  <button data-action="back">Retour</button>
</section>

<section id="menu-pause" class="screen hidden">
  <h2>Pause</h2>
  <button data-action="resume">Reprendre</button>
  <button data-action="options">Options</button>
  <button data-action="menu">Menu</button>
</section>

<section id="menu-end" class="screen hidden">
  <h2>Fin de mission</h2>
  <p id="end-record" class="record hidden">Nouveau record !</p>
  <div class="stats">
    <div>Score <b id="end-score"></b></div>
    <div>Vague <b id="end-wave"></b></div>
    <div>Temps <b id="end-time"></b></div>
    <div>Désactivations <b id="end-kills"></b></div>
    <div>Précision <b id="end-acc"></b></div>
  </div>
  <button data-action="play">Rejouer</button>
  <button data-action="menu">Menu</button>
</section>

<section id="menu-error" class="screen hidden">
  <h2>WebGL indisponible</h2>
  <p id="error-text"></p>
</section>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= CONFIG : équilibrage ================= */
const CONFIG = {
  loop: { step: 1 / 60, maxDelta: 0.05 },
  render: { pixelRatio: 1.5, fogNear: 30, fogFar: 120, cullDistance: 60, wallHeight: 6,
    bloom: { strength: 0.6, radius: 0.45, threshold: 0.8 }, envIntensity: 0.35, girderY: 9 },
  map: { cell: 2, origin: -40, size: 40 },

  ],

      score: 100, glow: 0x6fe6ff, scale: 1 },
    sentinel: { hp: 40, speed: 2.5, radius: 0.4, bodyY: 1.0, bodyR: 0.45, headY: 1.6, headR: 0.2,
      score: 200, glow: 0xff7a3d, scale: 1, fireInterval: 1.5, damage: 8, accuracy: 0.7, minRange: 12, maxRange: 18 },

      score: 300, glow: 0x3dfff0, scale: 1, burst: 3, burstGap: 0.12, burstInterval: 1.3, damage: 9,

      score: 500, glow: 0xffd23d, scale: 1, chargeSpeed: 7, chargeInterval: 6, chargeDamage: 35,
      knockback: 8, chargeTime: 1.5, windup: 0.6 },
    titan: { hp: 1000, speed: 2.0, radius: 0.9, bodyY: 2.2, bodyR: 1.6, headY: 4.2, headR: 0.5,
      score: 2000, glow: 0xff3df0, scale: 2, chargeSpeed: 9, chargeDamage: 35, fanDamage: 12,
      fanInterval: 0.9, fanVolleys: [3, 4, 5], phaseAt: [0.66, 0.33], stagger: 1.0 }
  },
  ai: {
    eyeRange: 40, fovCos: Math.cos(55 * Math.PI / 180), senseInterval: 0.2, memory: 5, alertTime: 0.5,
    healthBarTime: 3, disableTime: 3, fadeTime: 0.6, spawnTime: 0.5, spawnMinDist: 20, poolSize: 40,
    maxActive: 30, repathTime: 0.5, separation: 2.5, dropChance: 0.15, headBonus: 50, headMul: 2,
    hideTime: 2.5, patrolMul: 0.5, contactRange: 1.5, contactDps: 10, patrolRadius: 8, turnRate: 6, nearSense: 3
  },
  proj: { poolSize: 128, enemySpeed: 35, enemyDamage: 8, playerRadius: 0.35, lifetime: 2.5, trailInterval: 0.03 },
  waves: { breakTime: 8, spawnGap: 0.5, bannerTime: 2, titanEvery: 5, sentinelFrom: 3, tankFrom: 5, agentFrom: 2 },
  combo: { window: 4, tiers: [[3, 2], [6, 3], [9, 4]] },
  pickups: { repair: 25, shield: 50, poolSize: 12, bob: 0.12, dropLife: 20 },
  fx: { particles: 800, decals: 200, decalSize: 0.28, shells: 24, shellLife: 1.4, sparks: 14, burst: 36, titanBurst: 120 },
  audio: { music: 0.25, sfx: 0.6, loopSeconds: 16, storageKey: 'station-sigma-v1' },
  defaults: { sens: 1, invert: false, music: 0.5, sfx: 0.8, fov: 75, fps: false, shadows: 1024, bloom: true }
};

/* ================= Utilitaires ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
const MODE = { MENU: 0, PLAY: 1, PAUSE: 2, DEAD: 3 };
const ST = { PATROL: 0, ALERT: 1, CHASE: 2, SEARCH: 3, ATTACK: 4, DISABLED: 5 };
const ENEMY_TYPES = ['drone', 'sentinel', 'tank', 'titan', 'agent'];
/* Agents androïdes : nom et couleur de signature, façon jeu tactique */
const AGENTS = [['VEX', 0x3dfff0], ['NOVA', 0xff4fa3], ['KAIRO', 0xffc23d], ['ONYX', 0x9d7bff], ['RIFT', 0x5dff7a], ['SOL', 0xff7a3d]];
const TYPE_NAMES = { drone: 'DRONE', sentinel: 'SENTINELLE', tank: 'TANK', titan: 'TITAN' };
const KIND = { FLOOR: 0, WALL: 1, PLAT: 2, BALC: 3, RAMP: 4, CRATE: 5 };
const HALF_PI = Math.PI / 2;

let opts = { ...CONFIG.defaults };
let best = 0;
function loadState() {
  try {
    const raw = localStorage.getItem(CONFIG.audio.storageKey);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && typeof data.best === 'number') best = data.best;
    if (data && data.opts) opts = { ...opts, ...data.opts };
  } catch (err) {
    best = 0;
  }
}
function saveState() {
  try {
    localStorage.setItem(CONFIG.audio.storageKey, JSON.stringify({ best, opts }));
  } catch (err) {
    /* stockage indisponible : on ignore */
  }
}

/* ================= Carte : données ================= */
/* Un caractère = 2 m. # mur, . sol, = plateforme 3 m, ^ balcon 6 m, R rampe, C caisse,
   P spawn joueur, E spawn ennemi, H réparation, A bouclier, M munitions. */
const ROW = (w, d, c, e, f) => '#' + w + d + c + e + f + '#';
const MAP_ROWS = [
  '########################################',
  ROW('.C....C.', '#', '....................', '#', '.....C..'),
  ROW('.E......', '#', '....................', '#', '........'),
  ROW('........', '#', '....................', '.', '........'),
  ROW('..C.....', '#', '......^^^^^^^^......', '#', '........'),
  ROW('.A......', '#', '......^^^^^^^^......', '#', '........'),
  ROW('........', '#', '......^^^^^^^^......', '#', '....H...'),
  ROW('........', '#', '......^^^^^^^^......', '#', '........'),
  ROW('C.......', '#', '.........RRR........', '#', '........'),
  ROW('........', '#', '.........RRR........', '#', '......M.'),
  ROW('........', '#', '.........RRR........', '#', '........'),
  ROW('........', '#', '......========......', '#', '..E.....'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('.E......', '#', '......========......', '#', '........'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('........', '#', '......========......', '#', '...H....'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('........', '#', '...RRR========RRR...', '.', '........'),
  ROW('........', '#', '...RRR========RRR...', '.', '........'),
  ROW('........', '#', '...RRR========RRR...', '.', '........'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('..C.....', '#', '......========......', '#', '........'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('........', '#', '......========......', '#', '........'),
  ROW('........', '#', '....................', '#', '..E.....'),
  ROW('C.......', '#', '....C...............', '#', '....C...'),
  ROW('..====..', '#', '..P.................', '#', '........'),
  ROW('..====RR', 'R', '....................', '#', '........'),
  ROW('..====RR', 'R', '....................', '#', '........'),
  ROW('..====RR', 'R', '....................', '#', '........'),
  ROW('..====..', '#', '....................', '#', '........'),
  ROW('........', '#', '....##........##....', '#', '........'),
  ROW('C.......', '#', '....................', '#', '........'),
  ROW('........', '#', '..C.........C.......', '#', '........'),
  ROW('........', '#', '....................', '#', '..M.....'),
  ROW('..A.....', '#', '....................', '#', '........'),
  ROW('........', '#', '....E...............', '#', '........'),
  ROW('........', '#', '....................', '#', '........'),
  '########################################'
];

/* ================= Carte : cellules ================= */
const MAP_W = CONFIG.map.size, MAP_H = CONFIG.map.size;
const CELL = CONFIG.map.cell, O = CONFIG.map.origin;
const N_CELLS = MAP_W * MAP_H;
const cellKind = new Uint8Array(N_CELLS);
const cellBase = new Float32Array(N_CELLS);   // hauteur marchable (sol, plateforme, balcon)
const cellTop = new Float32Array(N_CELLS);    // sommet d'obstacle (mur, caisse, plateforme, balcon)
const rampOf = new Int16Array(N_CELLS).fill(-1);
let ramps = [];
const spawns = { player: { x: 0, z: 0 }, enemies: [], pickups: [] };

const isStand = (k) => k === KIND.FLOOR || k === KIND.PLAT || k === KIND.BALC;
function cellKindAt(c, r) {
  if (c < 0 || r < 0 || c >= MAP_W || r >= MAP_H) return KIND.WALL;
  return cellKind[r * MAP_W + c];
}

/* Rampe : run linéaire de cellules R entre deux extrémités à hauteurs différentes */
function buildRamp(c, r) {
  for (let axis = 0; axis < 2; axis++) {
    const along = axis === 0 ? c : r;
    const kindAlong = (t) => (axis === 0 ? cellKindAt(t, r) : cellKindAt(c, t));
    const idxAlong = (t) => (axis === 0 ? r * MAP_W + t : t * MAP_W + c);
    let a = along, b = along;
    while (kindAlong(a - 1) === KIND.RAMP) a--;

    if (hA === hB) continue;
    ramps.push({ axis, eA: O + a * CELL, hA, eB: O + (b + 1) * CELL, hB });
    const id = ramps.length - 1;
    for (let t = a; t <= b; t++) rampOf[idxAlong(t)] = id;

function parseMap() {
  ramps = [];

  spawns.pickups.length = 0;
  rampOf.fill(-1);
  for (let r = 0; r < MAP_H; r++) {
    if (MAP_ROWS[r].length !== MAP_W) throw new Error('Carte : ligne ' + r + ' invalide');
    for (let c = 0; c < MAP_W; c++) {
      const i = r * MAP_W + c, ch = MAP_ROWS[r][c];
      const x = O + c * CELL + CELL / 2, z = O + r * CELL + CELL / 2;
      let kind = KIND.FLOOR, base = 0, top = 0;
      switch (ch) {
        case '#': kind = KIND.WALL; top = CONFIG.render.wallHeight; break;
        case '=': kind = KIND.PLAT; base = 3; top = 3; break;
        case '^': kind = KIND.BALC; base = 6; top = 6; break;
        case 'C': kind = KIND.CRATE; top = 2; break;
        case 'R': kind = KIND.RAMP; break;
        case 'P': spawns.player.x = x; spawns.player.z = z; break;
        case 'E': spawns.enemies.push({ x, z }); break;
        case 'H': spawns.pickups.push({ type: 'repair', x, z }); break;
        case 'A': spawns.pickups.push({ type: 'shield', x, z }); break;
        case 'M': spawns.pickups.push({ type: 'ammo', x, z }); break;
        case '.': break;
        default: throw new Error('Carte : caractère inconnu ' + ch);
      }
      cellKind[i] = kind;
      cellBase[i] = base;
      cellTop[i] = top;
    }
  }
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      if (cellKind[r * MAP_W + c] === KIND.RAMP && rampOf[r * MAP_W + c] < 0) buildRamp(c, r);
    }
  }
  if (!spawns.enemies.length || !spawns.pickups.length) throw new Error('Carte : spawns manquants');
}

function cellIndex(x, z) {

  return r * MAP_W + c;

    const c0 = clamp(Math.floor((ent.x - hw - O) / CELL), 0, MAP_W - 1);
    const c1 = clamp(Math.floor((ent.x + hw - O - EPS) / CELL), 0, MAP_W - 1);
    const r0 = clamp(Math.floor((ent.z - hw - O) / CELL), 0, MAP_H - 1);
    const r1 = clamp(Math.floor((ent.z + hw - O - EPS) / CELL), 0, MAP_H - 1);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (!blocksMove(r * MAP_W + c, ent.feetY)) continue;
        if (dx > 0) ent.x = Math.min(ent.x, O + c * CELL - hw - EPS);
        else ent.x = Math.max(ent.x, O + (c + 1) * CELL + hw + EPS);

  }
  if (dz !== 0) {
    ent.z += dz;
    const c0 = clamp(Math.floor((ent.x - hw - O) / CELL), 0, MAP_W - 1);
    const c1 = clamp(Math.floor((ent.x + hw - O - EPS) / CELL), 0, MAP_W - 1);
    const r0 = clamp(Math.floor((ent.z - hw - O) / CELL), 0, MAP_H - 1);
    const r1 = clamp(Math.floor((ent.z + hw - O - EPS) / CELL), 0, MAP_H - 1);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {

/* Ligne de vue : échantillonnage tous les 0,5 m */

  for (let k = 1; k < n; k++) {

    if (solidAt(x0 + dx * t, y0 + dy * t, z0 + dz * t)) return true;

        if (!navOK[n] || navClosed[n] === navStampId) continue;
        if (Math.abs(navH[n] - navH[cur]) > 0.6) continue;
        const diag = dx !== 0 && dz !== 0;
        if (diag && (!navOK[cz * NAV + nx] || !navOK[nz * NAV + cx])) continue;

function computePath(path, fromX, fromZ, toX, toZ) {

  const gi = clamp(Math.floor(toX - O), 0, NAV - 1), gj = clamp(Math.floor(toZ - O), 0, NAV - 1);
  const len = findPath(si, sj, gi, gj);

    tmpPZ[m] = O + ((nd / NAV) | 0) + 0.5;

/* Normal map calculée depuis la luminance d'une texture canvas (Sobel) */
function normalFrom(tex, strength) {

    const i = (((y + h) % h) * w + ((x + w) % w)) * 4;

      const dy = (lum(x, y + 1) - lum(x, y - 1)) * strength;
      const len = Math.hypot(dx, dy, 1);
      const i = (y * w + x) * 4;
      out.data[i] = (-dx / len * 0.5 + 0.5) * 255;
      out.data[i + 1] = (dy / len * 0.5 + 0.5) * 255;
      out.data[i + 2] = (1 / len * 0.5 + 0.5) * 255;

  t.wrapT = THREE.RepeatWrapping;

/* Accumule des quadrilatères dans un seul BufferGeometry (une draw call par matériau) */
class GeoBuilder {
  constructor() { this.p = []; this.n = []; this.uv = []; this.ix = []; }
  quad(a, b, c, d, nx, ny, nz) {
    const base = this.p.length / 3;
    for (const v of [a, b, c, d]) {
      this.p.push(v[0], v[1], v[2]);
      this.n.push(nx, ny, nz);
      if (Math.abs(ny) > 0.5) this.uv.push(v[0] / 4, v[2] / 4);
      else if (Math.abs(nx) > 0.5) this.uv.push(v[2] / 4, v[1] / 4);
      else this.uv.push(v[0] / 4, v[1] / 4);
    }
    this.ix.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  /* Pavé aligné sur les axes : six faces */
  box(x0, y0, z0, x1, y1, z1) {
    this.quad([x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0], 0, 1, 0);
    this.quad([x0, y0, z1], [x0, y0, z0], [x1, y0, z0], [x1, y0, z1], 0, -1, 0);
    this.quad([x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1], 1, 0, 0);
    this.quad([x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [x0, y0, z0], -1, 0, 0);
    this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], 0, 0, 1);
    this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], 0, 0, -1);
  }
  get empty() { return this.ix.length === 0; }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.ix);
    g.computeBoundingSphere();
    return g;
  }
}
/* Hauteur de dessus d'une cellule au point (x, z) */
function topY(i, x, z) {
  return cellKind[i] === KIND.RAMP ? rampHeight(i, x, z) : cellTop[i];
}
function addTopQuad(b, i, x0, z0, x1, z1) {
  const h00 = topY(i, x0, z0), h01 = topY(i, x0, z1), h11 = topY(i, x1, z1), h10 = topY(i, x1, z0);
  const dhdx = (h10 - h00 + h11 - h01) / (2 * CELL);
  const dhdz = (h01 - h00 + h11 - h10) / (2 * CELL);
  const len = Math.hypot(dhdx, 1, dhdz);
  b.quad([x0, h00, z0], [x0, h01, z1], [x1, h11, z1], [x1, h10, z0], -dhdx / len, 1 / len, -dhdz / len);
}
/* Habillage d'une face de mur : écrans, conduites, colonnes lumineuses (sans collision, collés au mur) */
function decorateWallFace(B, e0, e1, nx, nz, seed) {
  const h = seed % 13;
  const ax = e0[0] + nx * 0.06, az = e0[1] + nz * 0.06, bx = e1[0] + nx * 0.06, bz = e1[1] + nz * 0.06;
  const at = (t, off) => [lerp(ax, bx, t) + nx * off, lerp(az, bz, t) + nz * off];
  if (h === 0 || h === 7) {
    const [p0x, p0z] = at(0.15, 0), [p1x, p1z] = at(0.85, 0);
    B.pipe.box(Math.min(p0x, p1x) - Math.abs(nx) * 0.05, 1.95, Math.min(p0z, p1z) - Math.abs(nz) * 0.05,
      Math.max(p0x, p1x) + Math.abs(nx) * 0.05, 3.45, Math.max(p0z, p1z) + Math.abs(nz) * 0.05);
    const [s0x, s0z] = at(0.2, 0.07), [s1x, s1z] = at(0.8, 0.07);
    B.screen.quad([s0x, 2.05, s0z], [s1x, 2.05, s1z], [s1x, 3.35, s1z], [s0x, 3.35, s0z], nx, 0, nz);
  } else if (h === 3 || h === 10) {
    const [q0x, q0z] = at(0, 0), [q1x, q1z] = at(1, 0.22);
    B.pipe.box(Math.min(q0x, q1x), 5.1, Math.min(q0z, q1z), Math.max(q0x, q1x), 5.32, Math.max(q0z, q1z));
    B.pipe.box(Math.min(q0x, q1x), 5.45, Math.min(q0z, q1z), Math.max(q0x, q1x), 5.6, Math.max(q0z, q1z));
  } else if (h === 5) {
    const [c0x, c0z] = at(0.47, 0), [c1x, c1z] = at(0.53, 0.05);
    B.lightbar.box(Math.min(c0x, c1x), 0.4, Math.min(c0z, c1z), Math.max(c0x, c1x), 3.9, Math.max(c0z, c1z));
  }
}
/* Charpente au-dessus de la station : poutres, piliers sur le mur extérieur, rampes lumineuses */
function buildGirders(B) {
  const y = CONFIG.render.girderY, L = O, R = -O;
  for (let k = 1; k < 10; k++) {
    const z = O + k * 8;
    B.girder.box(L, y, z - 0.3, R, y + 0.7, z + 0.3);
    B.lightbar.box(L + 1, y - 0.08, z - 0.06, R - 1, y, z + 0.06);
    B.girder.box(L, CONFIG.render.wallHeight, z - 0.4, L + 0.8, y + 0.7, z + 0.4);
    B.girder.box(R - 0.8, CONFIG.render.wallHeight, z - 0.4, R, y + 0.7, z + 0.4);
  }
  for (let k = 1; k < 5; k++) {
    const x = O + k * 16;
    B.girder.box(x - 0.25, y + 0.7, L, x + 0.25, y + 1.2, R);
  }
}
function buildMapMeshes() {
  if (mapGroup) {
    scene.remove(mapGroup);
    for (const g of mapGeoms) g.dispose();
  }
  mapGeoms.length = 0;
  mapGroup = new THREE.Group();
  const B = { girder: new GeoBuilder(), pipe: new GeoBuilder(), lightbar: new GeoBuilder(), screen: new GeoBuilder(),
    floor: new GeoBuilder(), wall: new GeoBuilder(), plat: new GeoBuilder(), balc: new GeoBuilder(),
    crate: new GeoBuilder(), glass: new GeoBuilder(), neonO: new GeoBuilder(), neonB: new GeoBuilder() };
  const sideOf = { [KIND.WALL]: B.wall, [KIND.PLAT]: B.plat, [KIND.CRATE]: B.crate, [KIND.BALC]: B.glass };
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const i = r * MAP_W + c, k = cellKind[i];
      const x0 = O + c * CELL, x1 = x0 + CELL, z0 = O + r * CELL, z1 = z0 + CELL;
      if (k === KIND.FLOOR || k === KIND.RAMP) addTopQuad(B.floor, i, x0, z0, x1, z1);
      else if (k === KIND.WALL) addTopQuad(B.wall, i, x0, z0, x1, z1);
      else if (k === KIND.PLAT) addTopQuad(B.plat, i, x0, z0, x1, z1);
      else if (k === KIND.BALC) addTopQuad(B.balc, i, x0, z0, x1, z1);
      else if (k === KIND.CRATE) addTopQuad(B.crate, i, x0, z0, x1, z1);
      if (k !== KIND.WALL && k !== KIND.PLAT && k !== KIND.BALC && k !== KIND.CRATE) continue;
      const T = cellTop[i];
      for (const [dc, dr] of dirs) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nr < 0 || nc >= MAP_W || nr >= MAP_H) continue;
        const ni = nr * MAP_W + nc, nk = cellKind[ni];
        const nSolid = nk === KIND.WALL || nk === KIND.PLAT || nk === KIND.BALC || nk === KIND.CRATE;
        if (nSolid && cellTop[ni] >= T) continue;
        let e0, e1, nx = dc, nz = dr;
        if (dc === 1) { e0 = [x1, z0]; e1 = [x1, z1]; }
        else if (dc === -1) { e0 = [x0, z1]; e1 = [x0, z0]; }
        else if (dr === 1) { e0 = [x1, z1]; e1 = [x0, z1]; }
        else { e0 = [x0, z0]; e1 = [x1, z0]; }
        const b0 = topY(ni, e0[0], e0[1]), b1 = topY(ni, e1[0], e1[1]);

        if (k === KIND.WALL && nk === KIND.FLOOR) {
          const o = 0.03;
          B.neonO.quad([e0[0] + nx * o, 4.2, e0[1] + nz * o], [e1[0] + nx * o, 4.2, e1[1] + nz * o],
            [e1[0] + nx * o, 4.5, e1[1] + nz * o], [e0[0] + nx * o, 4.5, e0[1] + nz * o], nx, 0, nz);
          B.neonB.quad([e0[0] + nx * o, 0.02, e0[1] + nz * o], [e1[0] + nx * o, 0.02, e1[1] + nz * o],
            [e1[0] + nx * o, 0.14, e1[1] + nz * o], [e0[0] + nx * o, 0.14, e0[1] + nz * o], nx, 0, nz);

        }

    }
  }
  buildGirders(B);

    if (b.empty) return;
    const g = b.build();
    mapGeoms.push(g);
    const m = new THREE.Mesh(g, mat);
    m.castShadow = shadow;
    m.receiveShadow = shadow;
    mapGroup.add(m);
  };
  add(B.floor, mats.floor, false);
  add(B.wall, mats.wall, true);
  add(B.plat, mats.plat, true);
  add(B.balc, mats.balc, true);
  add(B.crate, mats.crate, true);
  add(B.glass, mats.glass, false);
  add(B.neonO, mats.neonO, false);
  add(B.neonB, mats.neonB, false);
  add(B.girder, mats.girder, true);
  add(B.pipe, mats.pipe, false);
  add(B.lightbar, mats.lightbar, false);
  add(B.screen, mats.screen, false);
  scene.add(mapGroup);
}

  pmrem.dispose();
  scene.add(new THREE.HemisphereLight(0x9fc2ff, 0x1c2433, 0.9));

  sun.shadow.camera.left = -45;
  sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45;
  sun.shadow.camera.bottom = -45;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 120;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  /* Néons : quelques lumières ponctuelles seulement, pour limiter le coût du shader */
  const spots = [[20, 5, 6.5, 0xff8a2a], [19, 15, 4, 0xff8a2a], [26, 27, 3.2, 0xff8a2a],
    [34, 9, 3.2, 0x2d7dff], [5, 20, 3.2, 0x2d7dff]];
  for (const [c, r, y, col] of spots) {
    const pl = new THREE.PointLight(col, 5, 18, 1.6);
    pl.position.set(O + c * CELL + 1, y, O + r * CELL + 1);
    scene.add(pl);

  const pr = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(window.innerWidth * pr, window.innerHeight * pr, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const bl = CONFIG.render.bloom;
  bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), bl.strength, bl.radius, bl.threshold);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  applyShadowOption();
}

function animateDecor(dt) {

  if (decor.dust) {

    decor.dust.position.y = Math.sin(decor.t * 0.2) * 0.4;
  }
  if (decor.planet) decor.planet.rotation.y += dt * 0.01;

}

    if (!AC) return;

    musicBus = actx.createGain();
    sfxBus = actx.createGain();
    musicBus.connect(actx.destination);
    sfxBus.connect(actx.destination);
    applyVolumes();
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
    startAmbient();
  } catch (err) {
    actx = null;
  }
}
function applyVolumes() {
  if (!actx) return;
  musicBus.gain.value = opts.music;
  sfxBus.gain.value = opts.sfx;
}
function tone(freq, dur, type, vol, delay = 0, freqEnd = 0, bus = null) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(vol * CONFIG.audio.sfx, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus || sfxBus);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function noiseBurst(dur, vol, filterType, freq, q, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = filterType;
  f.frequency.value = freq;
  f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol * CONFIG.audio.sfx, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(sfxBus);
  src.start(t, Math.random() * 0.5);
  src.stop(t + dur + 0.05);
}
function playShot(w) {
  if (w === 0) { noiseBurst(0.09, 0.5, 'bandpass', 1800, 2); tone(900, 0.08, 'sawtooth', 0.15, 0, 200); }
  else if (w === 1) { noiseBurst(0.06, 0.35, 'lowpass', 2500, 1); tone(500, 0.05, 'square', 0.12, 0, 180); }
  else { noiseBurst(0.3, 0.6, 'bandpass', 400, 1); tone(180, 0.3, 'sine', 0.3, 0, 60); }
}

function playEmpty() { tone(1800, 0.02, 'square', 0.15); noiseBurst(0.03, 0.2, 'highpass', 4000, 1); }
function playFootstep() { noiseBurst(0.08, 0.25, 'lowpass', 400, 1); }
function playHitMarker(head) { tone(head ? 1600 : 1200, 0.05, 'sine', 0.25); }
function playDisable() { tone(1500, 0.45, 'sawtooth', 0.25, 0, 200); noiseBurst(0.2, 0.3, 'highpass', 2000, 1); }
function playHurt() { tone(90, 0.4, 'sawtooth', 0.35); tone(94, 0.4, 'sawtooth', 0.2); }

function playWhistle() { tone(900, 0.25, 'sine', 0.12, 0, 1400); }
function playRumble() { tone(55, 0.8, 'sawtooth', 0.18); noiseBurst(0.8, 0.25, 'lowpass', 200, 1); }
function playRoar() { tone(60, 1.2, 'sawtooth', 0.3, 0, 40); noiseBurst(1.0, 0.3, 'lowpass', 300, 1); }
function playShock() { tone(300, 0.6, 'sine', 0.2, 0, 1200); }
/* Nappe d'ambiance : quatre accords de 4 s, boucle de 16 s */
function startAmbient() {
  const chords = [[110, 164.8, 220], [98, 146.8, 196], [130.8, 164.8, 246.9], [87.3, 130.8, 174.6]];
  const pad = actx.createGain();
  pad.gain.value = 0.05 * CONFIG.audio.music;
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 700;
  pad.connect(lp).connect(musicBus);
  const oscs = [0, 1, 2].map(() => {
    const o = actx.createOscillator();
    o.type = 'sine';
    o.connect(pad);
    o.start();
    return o;
  });
  const schedule = (t0) => {
    chords.forEach((ch, k) => {
      oscs.forEach((o, j) => o.frequency.linearRampToValueAtTime(ch[j], t0 + k * 4 + 0.5));
    });
  };
  schedule(actx.currentTime);
  ambientTimer = setInterval(() => schedule(actx.currentTime + 0.05), CONFIG.audio.loopSeconds * 1000);
}

/* ================= Particules, douilles, décals (InstancedMesh, sans allocation) ================= */
const PART_N = CONFIG.fx.particles;
const pX = new Float32Array(PART_N), pY = new Float32Array(PART_N), pZ = new Float32Array(PART_N);
const pVX = new Float32Array(PART_N), pVY = new Float32Array(PART_N), pVZ = new Float32Array(PART_N);
const pLife = new Float32Array(PART_N), pMax = new Float32Array(PART_N), pSize = new Float32Array(PART_N);
const pGrav = new Float32Array(PART_N), pR = new Float32Array(PART_N), pG = new Float32Array(PART_N), pB = new Float32Array(PART_N);
let partCursor = 0;
let partInst = null;
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

function spawnParticle(x, y, z, vx, vy, vz, life, size, r, g, b, grav) {
  let k = partCursor;
  for (let n = 0; n < PART_N; n++) {
    if (pLife[k] <= 0) break;
    k = (k + 1) % PART_N;
  }
  partCursor = (k + 1) % PART_N;
  pX[k] = x; pY[k] = y; pZ[k] = z;
  pVX[k] = vx; pVY[k] = vy; pVZ[k] = vz;
  pLife[k] = life; pMax[k] = life; pSize[k] = size;
  pR[k] = r; pG[k] = g; pB[k] = b; pGrav[k] = grav;
}
/* Gerbe d'étincelles dans la direction (nx, ny, nz) */
function spawnSparks(x, y, z, nx, ny, nz, count, r, g, b) {
  for (let k = 0; k < count; k++) {
    const s = rnd(2, 6);
    spawnParticle(x, y, z, nx * s + rnd(-2, 2), ny * s + rnd(-1, 3), nz * s + rnd(-2, 2),
      rnd(0.15, 0.4), rnd(0.03, 0.06), r, g, b, 1);
  }
}
function spawnBurst(x, y, z, count, r, g, b, speed) {
  for (let k = 0; k < count; k++) {
    const a = Math.random() * Math.PI * 2, e = rnd(-0.6, 1);
    const s = rnd(speed * 0.4, speed);
    spawnParticle(x, y, z, Math.cos(a) * s, e * s + 1, Math.sin(a) * s,
      rnd(0.6, 1.3), rnd(0.05, 0.1), r, g, b, 0.6);
  }
}
function updateParticles(dt) {
  for (let k = 0; k < PART_N; k++) {
    if (pLife[k] > 0) {
      pLife[k] -= dt;
      pVY[k] -= 14 * pGrav[k] * dt;
      const drag = Math.exp(-2.5 * dt);
      pVX[k] *= drag; pVY[k] *= drag; pVZ[k] *= drag;
      pX[k] += pVX[k] * dt; pY[k] += pVY[k] * dt; pZ[k] += pVZ[k] * dt;
      if (pY[k] < 0.02) { pY[k] = 0.02; pVY[k] *= -0.3; pVX[k] *= 0.6; pVZ[k] *= 0.6; }
      const f = clamp(pLife[k] / pMax[k], 0, 1);
      dummy.position.set(pX[k], pY[k], pZ[k]);
      dummy.scale.setScalar(pSize[k] * (0.4 + 0.6 * f));
      dummy.updateMatrix();
      partInst.setMatrixAt(k, dummy.matrix);
      tmpColor.setRGB(pR[k] * f, pG[k] * f, pB[k] * f);
      partInst.setColorAt(k, tmpColor);
    } else {
      partInst.setMatrixAt(k, zeroMatrix);
    }
  }
  partInst.instanceMatrix.needsUpdate = true;
  partInst.instanceColor.needsUpdate = true;
}

const SHELL_N = CONFIG.fx.shells;
const shX = new Float32Array(SHELL_N), shY = new Float32Array(SHELL_N), shZ = new Float32Array(SHELL_N);
const shVX = new Float32Array(SHELL_N), shVY = new Float32Array(SHELL_N), shVZ = new Float32Array(SHELL_N);
const shLife = new Float32Array(SHELL_N), shSpin = new Float32Array(SHELL_N);
let shellCursor = 0, shellInst = null;
function spawnShell(x, y, z, side) {

  shLife[k] = CONFIG.fx.shellLife;
  shSpin[k] = rnd(10, 20);
}
function updateShells(dt) {
  for (let k = 0; k < SHELL_N; k++) {
    if (shLife[k] > 0) {
      shLife[k] -= dt;
      shVY[k] -= 14 * dt;
      shX[k] += shVX[k] * dt; shY[k] += shVY[k] * dt; shZ[k] += shVZ[k] * dt;
      if (shY[k] < 0.01) { shY[k] = 0.01; shVY[k] *= -0.35; shVX[k] *= 0.5; shVZ[k] *= 0.5; }
      dummy.position.set(shX[k], shY[k], shZ[k]);

const shocks = [];
function initShocks() {
  for (let k = 0; k < 3; k++) {
    const m = new THREE.Mesh(GEO.ring, mats.shock);

  }
}
function spawnShock(x, y, z, scale, life) {
  for (const s of shocks) {
    if (s.life <= 0) {
      s.life = life; s.t = 0; s.scale = scale;
      s.mesh.position.set(x, y + 0.05, z);
      s.mesh.visible = true;
      return;
    }
  }
}
function updateShocks(dt) {
  for (const s of shocks) {
    if (s.life <= 0) continue;
    s.t += dt;
    const f = s.t / s.life;
    if (f >= 1) { s.life = 0; s.mesh.visible = false; continue; }
    s.mesh.scale.setScalar(s.scale * (0.2 + f));
  }
}

const PROJ_KIND = { PULSE: 0, PLASMA: 1, ION: 2, ENEMY: 3 };
const projPool = [];
let projCursor = 0;
function initProjectiles() {
  for (let k = 0; k < CONFIG.proj.poolSize; k++) {
    const m = new THREE.Mesh(GEO.box, mats.bolt.pulse);
    m.visible = false;
    scene.add(m);
    projPool.push({ alive: false, kind: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, dmg: 0,
      traveled: 0, trailT: 0, speed: 0, hostile: false, mesh: m, origin: 0 });
  }
}
function setProjKind(p, kind) {
  p.kind = kind;
  const m = p.mesh;
  if (kind === PROJ_KIND.PULSE) { m.geometry = GEO.box; m.material = mats.bolt.pulse; m.scale.set(0.05, 0.05, 0.7); }
  else if (kind === PROJ_KIND.PLASMA) { m.geometry = GEO.box; m.material = mats.bolt.plasma; m.scale.set(0.09, 0.09, 1.1); }
  else if (kind === PROJ_KIND.ION) { m.geometry = GEO.sphere; m.material = mats.bolt.ion; m.scale.set(0.07, 0.07, 0.07); }
  else { m.geometry = GEO.sphere; m.material = mats.bolt.enemy; m.scale.set(0.12, 0.12, 0.12); }
}
function fireProjectile(kind, x, y, z, dx, dy, dz, speed, dmg, hostile) {
  let k = projCursor;
  for (let n = 0; n < projPool.length; n++) {
    if (!projPool[k].alive) break;
    k = (k + 1) % projPool.length;
  }
  projCursor = (k + 1) % projPool.length;
  const p = projPool[k];
  setProjKind(p, kind);
  p.alive = true;
  p.x = x; p.y = y; p.z = z;
  p.vx = dx * speed; p.vy = dy * speed; p.vz = dz * speed;
  p.speed = speed;
  p.life = CONFIG.proj.lifetime;
  p.dmg = dmg;
  p.traveled = 0;
  p.trailT = 0;
  p.hostile = hostile;
  p.mesh.visible = true;
  p.mesh.position.set(x, y, z);
  p.mesh.lookAt(x + dx, y + dy, z + dz);

}
function killProjectile(p) {

function buildRobot(type, m) {

function mesh(geo, mat, x, y, z, sx, sy, sz, rx = 0) {

/* Directions de tir : base caméra + dispersion en disque */
const aim = { fx: 0, fy: 0, fz: 0, rx: 1, ry: 0, rz: 0, ux: 0, uy: 1, uz: 0 };
function computeAim() {
  const yaw = player.yaw, pitch = player.pitch + player.recoil * DEG;
  const sy = Math.sin(yaw), cy = Math.cos(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch);
  aim.fx = -sy * cp; aim.fy = sp; aim.fz = -cy * cp;
  aim.rx = cy; aim.ry = 0; aim.rz = -sy;
  aim.ux = sy * sp; aim.uy = cp; aim.uz = cy * sp;
}
let aimDX = 0, aimDY = 0, aimDZ = 0;
function shootDirection(spreadDeg) {
  const a = spreadDeg * DEG * Math.sqrt(Math.random());
  const phi = Math.random() * Math.PI * 2;
  const ox = Math.cos(phi) * Math.tan(a), oy = Math.sin(phi) * Math.tan(a);
  let dx = aim.fx + aim.rx * ox + aim.ux * oy;
  let dy = aim.fy + aim.ry * ox + aim.uy * oy;
  let dz = aim.fz + aim.rz * ox + aim.uz * oy;
  const len = Math.hypot(dx, dy, dz);
  aimDX = dx / len; aimDY = dy / len; aimDZ = dz / len;
}

/* Entrées clavier et souris (pointer lock) */
function onKeyDown(e) {
  if (e.code === 'Escape') {
    if (mode === MODE.PLAY) pauseGame();
    else if (mode === MODE.PAUSE) resumeGame();
    e.preventDefault();
    return;
  }
  if (e.code === 'KeyF' && !e.repeat) {
    toggleFullscreen();
    return;
  }
  if (e.code === 'KeyM' && !e.repeat) {
    $('minimap').classList.toggle('hidden');
    return;
  }
  if (mode !== MODE.PLAY) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  input.keys[e.code] = true;
  if (e.code === 'Space') player.jumpQueued = true;
  if (e.code === 'KeyR') input.reloadEdge = true;
  if (e.code === 'Digit1') switchWeapon(0);
  if (e.code === 'Digit2') switchWeapon(1);
  if (e.code === 'Digit3') switchWeapon(2);
}
function onKeyUp(e) {
  input.keys[e.code] = false;
}
function onMouseDown(e) {
  if (mode === MODE.PLAY && document.pointerLockElement !== $('game')) {
    requestLock();
    return;
  }
  if (mode !== MODE.PLAY) return;
  if (e.button === 0) { input.fire = true; input.fireEdge = true; }
  if (e.button === 2) player.aim = true;
}
function onMouseUp(e) {
  if (e.button === 0) input.fire = false;
  if (e.button === 2) player.aim = false;
}
function onMouseMove(e) {
  if (mode !== MODE.PLAY || document.pointerLockElement !== $('game')) return;
  const k = opts.sens * 0.0022;
  player.yaw -= e.movementX * k;
  vm.swayX += e.movementX;
  vm.swayY += e.movementY;
  player.pitch = clamp(player.pitch - e.movementY * k * (opts.invert ? -1 : 1), -HALF_PI + 0.01, HALF_PI - 0.01);
}
function onWheel(e) {
  if (mode !== MODE.PLAY) return;
  const dir = e.deltaY > 0 ? 1 : -1;
  switchWeapon((cur + dir + CONFIG.weapons.length) % CONFIG.weapons.length);
}
function requestLock() {
  const c = $('game');
  try {
    const p = c.requestPointerLock();
    if (p && p.catch) p.catch(() => {});
  } catch (err) {
    /* pointer lock indisponible : le jeu reste en pause */
  }
}
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      const p = document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } else {
      const p = document.exitFullscreen();
      if (p && p.catch) p.catch(() => {});
    }
  } catch (err) {
    /* plein écran refusé */
  }
}
function switchWeapon(i) {
  if (i === cur || switchT > 0 || mode !== MODE.PLAY) return;
  wstate[cur].reloading = false;
  vm.models[cur].visible = false;
  cur = i;
  vm.models[cur].visible = true;
  switchT = PC.switchTime;
}

/* ================= Mise à jour du joueur ================= */
function updatePlayer(dt) {
  const P = player;
  const fw = (input.keys.KeyW || input.keys.KeyZ ? 1 : 0) - (input.keys.KeyS ? 1 : 0);
  const sd = (input.keys.KeyD ? 1 : 0) - (input.keys.KeyA || input.keys.KeyQ ? 1 : 0);
  P.crouch = !!(input.keys.ControlLeft || input.keys.ControlRight);
  P.sprint = !!(input.keys.ShiftLeft || input.keys.ShiftRight) && fw > 0 && !P.crouch && !P.aim;
  const speed = P.crouch ? PC.crouch : P.sprint ? PC.sprint : PC.walk;
  let mx = 0, mz = 0;
  if (fw || sd) {
    const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
    mx = -sy * fw + cy * sd;
    mz = -cy * fw - sy * sd;
    const len = Math.hypot(mx, mz);
    mx /= len; mz /= len;
  }
  const k = 1 - Math.exp(-PC.accel * dt);
  P.vx += (mx * speed - P.vx) * k;
  P.vz += (mz * speed - P.vz) * k;
  const kd = Math.exp(-PC.knockDecay * dt);
  P.kbX *= kd; P.kbZ *= kd;
  moveBox(P, (P.vx + P.kbX) * dt, (P.vz + P.kbZ) * dt, PC.radius);

  if (P.jumpQueued && P.onGround && !P.crouch) {
    P.vy = Math.sqrt(2 * PC.gravity * PC.jumpHeight);
    P.onGround = false;
  }
  P.jumpQueued = false;
  const wasOn = P.onGround;
  P.vy -= PC.gravity * dt;
  P.feetY += P.vy * dt;
  const g = groundAt(P.x, P.z, PC.radius);
  if (P.feetY <= g) {
    P.feetY = g;
    P.vy = 0;
    P.onGround = true;
  } else if (P.onGround && P.feetY - g < PC.stepUp) {
    P.feetY = g;
    P.vy = 0;
  } else {
    P.onGround = false;
  }
  if (P.onGround) {
    if (!wasOn && P.peakY - P.feetY > PC.fallSafe) damagePlayer(PC.fallDamage, P.x, P.z);
    P.peakY = P.feetY;
  } else {
    P.peakY = Math.max(P.peakY, P.feetY);
  }

  const hSpeed = Math.hypot(P.vx, P.vz);
  if (P.onGround && hSpeed > 1) {
    P.stepAcc += hSpeed * dt;
    if (P.stepAcc > (P.crouch ? PC.footstep * 1.3 : PC.footstep)) {
      P.stepAcc = 0;
      playFootstep();
    }
    P.bobT += dt * hSpeed * PC.bobRate;
  }
  const bobTarget = P.onGround && hSpeed > 1 ? Math.sin(P.bobT) * PC.bobAmp * (hSpeed / PC.sprint) : 0;
  P.bobY += (bobTarget - P.bobY) * Math.min(1, 12 * dt);
  P.eye += ((P.crouch ? PC.eyeCrouch : PC.eyeStand) - P.eye) * Math.min(1, 10 * dt);

  const fovTarget = P.aim ? PC.fovAim : opts.fov + (P.sprint ? PC.fovSprint : 0);
  P.fov += (fovTarget - P.fov) * Math.min(1, 10 * dt);
  P.recoil *= Math.exp(-PC.recoilDecay * dt);
  P.recoilYaw *= Math.exp(-PC.recoilDecay * dt);
  P.hurtT = Math.max(0, P.hurtT - dt);
  P.hurtAmt *= Math.exp(-1.6 * dt);
  P.dirT = Math.max(0, P.dirT - dt);
}

/* alpha : fraction du pas fixe écoulée, pour un rendu lissé entre deux pas de simulation */
function updateCamera(dt, alpha = 1) {
  const P = player;
  const a = clamp(alpha, 0, 1);
  camera.position.set(lerp(P.px, P.x, a), lerp(P.pFeet, P.feetY, a) + P.eye + P.bobY, lerp(P.pz, P.z, a));
  camera.rotation.set(P.pitch + P.recoil * DEG, P.yaw + P.recoilYaw * DEG, 0);
  if (Math.abs(camera.fov - P.fov) > 0.01) {
    camera.fov = P.fov;
    camera.updateProjectionMatrix();
  }
  /* Recul visuel de l'arme et flash de bouche */
  vm.kick *= Math.exp(-14 * dt);
  const baseX = P.aim ? 0.05 : 0.22;
  const ks = Math.min(1, 10 * dt);
  vm.sx += (clamp(-vm.swayX * 0.0005, -0.05, 0.05) - vm.sx) * ks;
  vm.sy += (clamp(vm.swayY * 0.0005, -0.04, 0.04) - vm.sy) * ks;
  vm.swayX *= Math.exp(-18 * dt);
  vm.swayY *= Math.exp(-18 * dt);
  const walk = P.onGround ? Math.hypot(P.vx, P.vz) / PC.sprint : 0;
  const bobX = Math.cos(P.bobT * 0.5) * 0.012 * walk * (P.aim ? 0.3 : 1);
  const bobY = Math.abs(Math.sin(P.bobT * 0.5)) * 0.01 * walk * (P.aim ? 0.3 : 1);
  for (let k = 0; k < vm.models.length; k++) {
    const g = vm.models[k];
    const lower = switchT > 0 && k === cur ? -0.15 * (switchT / PC.switchTime) : 0;
    const reloadDip = wstate[k].reloading ? -0.08 * Math.sin(Math.PI * clamp(1 - wstate[k].reloadT / CONFIG.weapons[k].reload, 0, 1)) : 0;
    g.position.set(baseX + vm.sx + bobX, -0.2 + lower + reloadDip - vm.kick * 0.2 + vm.sy - bobY, -0.42 + vm.kick * 0.5);
    g.rotation.set(-vm.kick * 0.6 + vm.sy * 1.5, vm.sx * 2, vm.sx * 1.5);
  }
  vm.light.intensity *= Math.exp(-28 * dt);
  vm.muzzleT = Math.max(0, vm.muzzleT - dt);
  const showFlash = vm.muzzleT > 0;
  vm.muzzle[cur].visible = showFlash;
  if (showFlash) vm.muzzle[cur].rotation.z = vm.muzzleT * 40;
}

/* ================= Armes ================= */
function updateWeapons(dt) {
  const w = CONFIG.weapons[cur], s = wstate[cur];
  const ion = cur === 2;
  s.cool = Math.max(0, s.cool - dt);
  switchT = Math.max(0, switchT - dt);
  if (!input.fire && s.bloom > 0) s.bloom = Math.max(0, s.bloom - (w.bloomRecover || 0) * dt);
  if (s.reloading) {
    s.reloadT -= dt;
    if (s.reloadT <= 0) {
      if (ion) {
        s.mag++;
        s.reserve--;
        if (s.mag < w.mag && s.reserve > 0) s.reloadT += w.reload;
        else { s.reloading = false; playReload(); }
      } else {
        const take = Math.min(w.mag - s.mag, s.reserve);
        s.mag += take;
        s.reserve -= take;
        s.reloading = false;
        playReload();
      }
    }
  }
  if (input.reloadEdge) {
    input.reloadEdge = false;
    if (!s.reloading && s.mag < w.mag && s.reserve > 0 && switchT <= 0) {
      s.reloading = true;
      s.reloadT = w.reload;
      playReload();
    }
  }
  const wantShot = input.fireEdge || (w.auto && input.fire);
  input.fireEdge = false;
  if (wantShot && switchT <= 0 && s.cool <= 0) {
    if (s.mag > 0 && ion && s.reloading) s.reloading = false;
    if (s.mag > 0 && !s.reloading) fireWeapon(w, s, cur);
    else if (s.mag === 0) {
      playEmpty();
      showToast('Recharger !');
      s.cool = 0.25;
    }
  }
}
function fireWeapon(w, s, idx) {
  s.mag--;
  s.cool = 1 / w.rate;
  computeAim();
  const spread = w.spread * (player.aim ? PC.aimSpread : 1) + s.bloom;
  const P = player;
  /* Origine : légèrement devant et à droite de la caméra */
  const ox = P.x + aim.fx * 0.5 + aim.rx * 0.2 - aim.ux * 0.12;
  const oy = P.feetY + P.eye + P.bobY + aim.fy * 0.5 + aim.ry * 0.2 - aim.uy * 0.12;
  const oz = P.z + aim.fz * 0.5 + aim.rz * 0.2 - aim.uz * 0.12;
  const kind = idx === 0 ? PROJ_KIND.PULSE : idx === 1 ? PROJ_KIND.PLASMA : PROJ_KIND.ION;
  for (let k = 0; k < w.pellets; k++) {
    shootDirection(spread);
    fireProjectile(kind, ox, oy, oz, aimDX, aimDY, aimDZ, w.speed, w.damage, false);
    stats.shots++;
  }
  if (idx === 1) s.bloom = Math.min(w.bloomMax, s.bloom + w.bloomStep);
  P.recoil += w.recoil;
  P.recoilYaw = (Math.random() - 0.5) * w.recoil * 0.5;
  vm.kick = Math.min(1, vm.kick + w.kick * 40);
  vm.muzzleT = 0.05;
  vm.light.color.setHex(w.color);
  vm.light.intensity = idx === 2 ? 14 : 8;
  spawnShell(ox + aim.rx * 0.1, oy, oz + aim.rz * 0.1, 1);
  if (idx === 2) spawnBurst(ox, oy, oz, 4, 1, 0.6, 0.2, 2);

}

/* ================= Projectiles ================= */
const hitInfo = { head: false, enemy: null };
function enemyAtPoint(x, y, z) {
  for (const e of enemies) {
    if (!e.alive || e.state === ST.DISABLED || e.spawnT > 0) continue;
    const def = CONFIG.enemies[e.type];
    const dx = x - e.x, dz = z - e.z;
    if (dx * dx + dz * dz > def.bodyR * def.bodyR) continue;
    const hy = e.feetY + def.headY - y, hr = def.headR;
    if (dx * dx + hy * hy + dz * dz < hr * hr) { hitInfo.head = true; hitInfo.enemy = e; return e; }
    const by = e.feetY + def.bodyY - y;
    if (dx * dx + by * by + dz * dz < def.bodyR * def.bodyR) { hitInfo.head = false; hitInfo.enemy = e; return e; }
  }
  return null;
}
function playerHitAt(x, y, z) {
  const P = player;
  const dx = x - P.x, dz = z - P.z;
  return dx * dx + dz * dz < (PC.radius + CONFIG.proj.playerRadius) ** 2 && y > P.feetY - 0.1 && y < P.feetY + P.eye + 0.2;
}
function falloffFor(dist) {
  const w = CONFIG.weapons[2];
  if (dist <= w.falloffStart) return 1;
  return Math.max(w.falloffMin, 1 - ((dist - w.falloffStart) / (w.falloffEnd - w.falloffStart)) * (1 - w.falloffMin));
}
function updateProjectiles(dt) {
  for (const p of projPool) {
    if (!p.alive) continue;
    const dx = p.vx * dt, dy = p.vy * dt, dz = p.vz * dt;
    const len = Math.hypot(dx, dy, dz);
    const n = Math.max(1, Math.ceil(len / (p.hostile ? 0.2 : 0.12)));
    let px = p.x, py = p.y, pz = p.z, done = false;
    for (let s = 1; s <= n; s++) {
      const t = s / n;
      const qx = p.x + dx * t, qy = p.y + dy * t, qz = p.z + dz * t;
      if (solidAt(qx, qy, qz)) {
        impactWorld(px, py, pz, qx, qy, qz, p.kind);
        killProjectile(p);
        done = true;
        break;
      }
      if (p.hostile) {
        if (playerHitAt(qx, qy, qz)) {
          damagePlayer(p.dmg, p.x, p.z);
          killProjectile(p);
          done = true;
          break;
        }
      } else {
        const e = enemyAtPoint(qx, qy, qz);
        if (e) {
          let dmg = p.dmg;
          if (p.kind === PROJ_KIND.ION) dmg *= falloffFor(p.traveled + len * t);
          spawnSparks(qx, qy, qz, -p.vx, 0.5, -p.vz, 8, 1, 0.6, 0.2);
          stats.hits++;
          damageEnemy(e, dmg, hitInfo.head);
          killProjectile(p);
          done = true;
          break;
        }
      }
      px = qx; py = qy; pz = qz;
    }
    if (done) continue;
    p.x += dx; p.y += dy; p.z += dz;
    p.traveled += len;
    p.life -= dt;
    if (p.life <= 0) { killProjectile(p); continue; }
    p.mesh.position.set(p.x, p.y, p.z);
    p.mesh.lookAt(p.x + p.vx, p.y + p.vy, p.z + p.vz);
    if (p.kind === PROJ_KIND.PLASMA) {
      p.trailT -= dt;
      if (p.trailT <= 0) {
        p.trailT = CONFIG.proj.trailInterval;
        spawnParticle(p.x, p.y, p.z, rnd(-0.2, 0.2), rnd(-0.2, 0.2), rnd(-0.2, 0.2), 0.25, 0.08, 0.4, 1, 0.5, 0);
      }
    }
  }
}
/* Impact sur un mur : étincelles et décal sur la face touchée */
function impactWorld(px, py, pz, qx, qy, qz, kind) {
  let nx = 0, ny = 0, nz = 0;
  if (qy < 0) ny = 1;
  else if (Math.floor((px - O) / CELL) !== Math.floor((qx - O) / CELL)) nx = Math.sign(px - qx);
  else if (Math.floor((pz - O) / CELL) !== Math.floor((qz - O) / CELL)) nz = Math.sign(pz - qz);
  else ny = 1;
  if (kind === PROJ_KIND.PLASMA) spawnSparks(px, py, pz, nx, ny, nz, 6, 0.4, 1, 0.5);
  else spawnSparks(px, py, pz, nx, ny, nz, 8, 1, 0.6, 0.2);
  if (qy >= 0) spawnDecal(px, py, pz, nx, ny, nz);
}

/* ================= Pickups ================= */
function updatePickups(dt) {
  const P = player;
  for (const p of pickups) {
    if (!p.alive) {
      if (p.spot && p.respawnT > 0) {
        p.respawnT -= dt;
        if (p.respawnT <= 0) { p.alive = true; p.mesh.visible = true; }
      }
      continue;
    }
    p.t += dt;
    p.mesh.position.set(p.x, p.y + Math.sin(p.t * 2) * CONFIG.pickups.bob, p.z);
    p.mesh.rotation.y += dt * 1.6;
    if (!p.spot) {
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; p.mesh.visible = false; continue; }
    }
    const dx = p.x - P.x, dz = p.z - P.z;
    if (dx * dx + dz * dz < PC.pickupRange * PC.pickupRange && Math.abs(P.feetY - p.y) < 1.5) {
      applyPickup(p.type);

}
function applyPickup(type) {

    P.hull = Math.min(PC.hull, P.hull + CONFIG.pickups.repair);

/* ================= Dégâts joueur ================= */
function damagePlayer(amount, fromX, fromZ) {
  if (mode !== MODE.PLAY) return;
  const P = player;
  let rem = amount;
  if (P.shield > 0) {
    const absorbed = Math.min(P.shield, rem);
    P.shield -= absorbed;
    rem -= absorbed;
  }
  if (rem > 0) P.hull = Math.max(0, P.hull - rem);
  P.hurtAmt = clamp(P.hurtAmt + amount / 40, 0, 1);
  const wasHurt = P.hurtT > 0;
  P.hurtT = 0.6;
  /* Angle de la source par rapport au regard */
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  const vx = fromX - P.x, vz = fromZ - P.z;
  P.dirAngle = Math.atan2(fx * vz - fz * vx, fx * vx + fz * vz) / DEG;
  P.dirT = 1.2;
  if (!wasHurt) playHurt();
  combo.streak = 0;
  combo.timer = 0;
  combo.mult = 1;
  if (P.hull <= 0) endGame();
}

/* ================= Ennemis : IA ================= */
const AI = CONFIG.ai;
const W = { n: 0, state: 'break', timer: CONFIG.waves.breakTime, spawnT: 0, spawnIdx: 0,
  queue: { titan: 0, tank: 0, sentinel: 0, drone: 0, agent: 0 } };
const TYPE_BODY = { drone: 0x8fa3bb, sentinel: 0x9aa3ad, tank: 0x7d8290, titan: 0x5b4d6b, agent: 0x5a6680 };

function resetEnemies() {
  for (const e of enemies) {
    e.alive = false;
    e.root.visible = false;
    e.bar.visible = false;
  }
}
function activeEnemies() {
  let n = 0;
  for (const e of enemies) if (e.alive && e.state !== ST.DISABLED) n++;
  return n;
}
function queuedEnemies() {
  return W.queue.titan + W.queue.tank + W.queue.sentinel + W.queue.drone + W.queue.agent;
}
function turnTo(cur, target, maxStep) {
  let d = target - cur;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + clamp(d, -maxStep, maxStep);
}
function faceTowards(e, tx, tz, dt) {
  e.yaw = turnTo(e.yaw, Math.atan2(-(tx - e.x), -(tz - e.z)), AI.turnRate * dt);
}
const isRanged = (t) => t === 'sentinel' || t === 'titan' || t === 'agent';
function setState(e, st, time) {
  e.state = st;
  e.stateT = time;
}
/* Vision : cône de 110°, portée 40 m, bloquée par les murs et les caisses */
function canSee(e, def) {
  const P = player;
  const dx = P.x - e.x, dz = P.z - e.z;
  const d2 = dx * dx + dz * dz;
  if (d2 > AI.eyeRange * AI.eyeRange) return false;
  const d = Math.sqrt(d2) || 1;
  const fx = -Math.sin(e.yaw), fz = -Math.cos(e.yaw);
  /* Au contact, le robot sent le joueur même hors du cône */
  if (d > AI.nearSense && (fx * dx + fz * dz) / d < AI.fovCos) return false;
  return !lineBlocked(e.x, e.feetY + def.headY * 0.9, e.z, P.x, P.feetY + P.eye, P.z);
}
/* Déplacement vers (tx, tz) avec séparation entre robots */
function moveTowards(e, tx, tz, speed, dt, def) {
  const dx = tx - e.x, dz = tz - e.z;
  const d = Math.hypot(dx, dz);
  let wantX = 0, wantZ = 0;
  if (d > 0.05) { wantX = (dx / d) * speed; wantZ = (dz / d) * speed; }
  let sx = 0, sz = 0;
  for (const o of enemies) {
    if (o === e || !o.alive || o.state === ST.DISABLED) continue;
    const ox = e.x - o.x, oz = e.z - o.z;
    const od2 = ox * ox + oz * oz;
    if (od2 > 1.44 || od2 < 1e-6) continue;
    const od = Math.sqrt(od2);
    const push = (1.2 - od) / od;
    sx += ox * push;
    sz += oz * push;
  }
  const k = Math.min(1, 8 * dt);
  e.vx += (wantX + sx * AI.separation - e.vx) * k;
  e.vz += (wantZ + sz * AI.separation - e.vz) * k;
  if (Math.abs(e.vx) + Math.abs(e.vz) > 0.05) e.yaw = turnTo(e.yaw, Math.atan2(-e.vx, -e.vz), AI.turnRate * dt);
  moveBox(e, e.vx * dt, e.vz * dt, def.radius);
  const g = groundAt(e.x, e.z, def.radius * 0.8);
  if (isFinite(g)) e.feetY = g;
}
/* Suivi de chemin A* (recalculé toutes les 0,5 s ou au changement de case) */
function followTo(e, tx, tz, speed, dt, def) {
  e.pathT -= dt;
  const gi = Math.floor(tx - O), gj = Math.floor(tz - O);
  if (e.pathT <= 0 || gi !== e.goalI || gj !== e.goalJ) {
    computePath(e.path, e.x, e.z, tx, tz);
    e.pathT = AI.repathTime + Math.random() * 0.2;
    e.goalI = gi;
    e.goalJ = gj;
  }
  let wx = tx, wz = tz;
  const pth = e.path;
  if (pth.n > 0) {
    while (pth.i < pth.n - 1 && Math.hypot(pth.x[pth.i] - e.x, pth.z[pth.i] - e.z) < 0.6) pth.i++;
    wx = pth.x[pth.i];
    wz = pth.z[pth.i];
  }
  moveTowards(e, wx, wz, speed, dt, def);
}
/* Vitesse de déplacement : décélération naturelle à l'arrêt */
function idleMove(e, dt, def) {
  e.vx *= Math.exp(-6 * dt);
  e.vz *= Math.exp(-6 * dt);
  moveBox(e, e.vx * dt, e.vz * dt, def.radius);
  const g = groundAt(e.x, e.z, def.radius * 0.8);
  if (isFinite(g)) e.feetY = g;
}
/* Tir d'un robot : précision 70 % pour la sentinelle */
function enemyShoot(e, def, accuracy) {
  const P = player;
  const sx = e.x, sy = e.feetY + def.headY * 0.85, sz = e.z;
  let tx = P.x, ty = P.feetY + P.eye * 0.7, tz = P.z;
  if (Math.random() < accuracy) {
    tx += rnd(-0.2, 0.2); ty += rnd(-0.2, 0.2); tz += rnd(-0.2, 0.2);
  } else {
    tx += rnd(-2.5, 2.5); ty += rnd(-1, 1); tz += rnd(-2.5, 2.5);
  }
  const dx = tx - sx, dy = ty - sy, dz = tz - sz;
  const len = Math.hypot(dx, dy, dz);
  fireProjectile(PROJ_KIND.ENEMY, sx, sy, sz, dx / len, dy / len, dz / len, def.shotSpeed || CONFIG.proj.enemySpeed, def.damage, true);
  if (e.type === 'agent') playAgentShot();
  else playWhistle();
}
/* Éventail du titan : cinq projectiles étalés autour de la cible */
function titanFan(e, def) {
  const P = player;
  const sx = e.x, sy = e.feetY + def.headY, sz = e.z;
  const base = Math.atan2(P.x - sx, P.z - sz);
  for (const a of [-30, -15, 0, 15, 30]) {
    const ang = base + a * DEG;
    const dy = (P.feetY + P.eye * 0.5 - sy) / Math.max(1, Math.hypot(P.x - sx, P.z - sz));
    const dx = Math.sin(ang), dz = Math.cos(ang);
    const len = Math.hypot(dx, dy, dz);
    fireProjectile(PROJ_KIND.ENEMY, sx, sy, sz, dx / len, dy / len, dz / len, CONFIG.proj.enemySpeed, def.fanDamage, true);
  }
  playWhistle();
}
/* Recherche d'une caisse à couvert, invisible depuis le joueur */
function findCover(e) {
  const P = player;
  let best = null, bestD = 1e9;
  for (let i = 0; i < N_CELLS; i++) {
    if (cellKind[i] !== KIND.CRATE) continue;
    const cc = i % MAP_W, rr = (i / MAP_W) | 0;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = cc + dc, nr = rr + dr;
      if (nc < 0 || nr < 0 || nc >= MAP_W || nr >= MAP_H) continue;
      if (cellKind[nr * MAP_W + nc] !== KIND.FLOOR) continue;
      const cx = O + nc * CELL + CELL / 2, cz = O + nr * CELL + CELL / 2;
      const d = Math.hypot(cx - e.x, cz - e.z);
      if (d > 10 || d >= bestD) continue;
      if (!lineBlocked(P.x, P.feetY + P.eye, P.z, cx, 1.2, cz)) continue;
      best = [cx, cz];
      bestD = d;
    }
  }
  return best;
}
function startCover(e) {
  const c = findCover(e);
  if (!c) return;
  e.cover = true;
  e.coverX = c[0];
  e.coverZ = c[1];
  e.hideT = 0;
  e.pathT = 0;
}
/* Fil des éliminations, en haut à droite */
function pushKillFeed(name, head, color) {

  el.style.borderRightColor = '#' + color.toString(16).padStart(6, '0');
  const who = document.createElement('b');

  el.append(who, ' ▸ ' + name + (head ? ' ◎' : ''));

}
function multiplierFor(streak) {
  let m = 1;
  for (const [need, mul] of CONFIG.combo.tiers) if (streak >= need) m = mul;
  return m;
}

/* Dégâts reçus par un robot (tête = dégâts doublés + 50 points) */
function damageEnemy(e, dmg, head) {
  if (!e.alive || e.state === ST.DISABLED || e.spawnT > 0) return;
  let d = dmg;
  if (head) {
    d *= AI.headMul;
    stats.score += AI.headBonus;
  }
  e.hp -= d;
  e.healthT = AI.healthBarTime;

  if (e.type === 'sentinel' && e.hp > 0 && !e.cover) startCover(e);

}
function checkTitanPhase(e) {
  const def = CONFIG.enemies.titan;
  const f = e.hp / e.maxHp;
  let ph = 0;
  if (f <= def.phaseAt[0]) ph = 1;
  if (f <= def.phaseAt[1]) ph = 2;
  if (ph > e.phase) {
    e.phase = ph;
    e.stagger = def.stagger;

}
function killEnemy(e, head = false) {

  const cy = e.feetY + def.bodyY;

  if (big) {

    spawnBurst(e.x, cy + 1, e.z, 60, 1, 0.5, 1, 10);

  if (Math.random() < AI.dropChance) {

/* Désactivation : étincelles, puis fondu après 3 s et retour dans le pool */
function updateDisabled(e, dt, def) {

  if (e.sparkT <= 0 && e.dispT < AI.disableTime) {

  }
  const part = e.parts[e.type];

function updateEnemy(e, dt) {

    e.flashT -= dt;

}
function updatePatrol(e, dt, def) {

  }
  e.wanderT -= dt;
  if (e.wanderT <= 0 || e.path.i >= e.path.n) {
    const tx = clamp(e.x + rnd(-AI.patrolRadius, AI.patrolRadius), O + 1, -O - 1);
    const tz = clamp(e.z + rnd(-AI.patrolRadius, AI.patrolRadius), O + 1, -O - 1);
    computePath(e.path, e.x, e.z, tx, tz);
    e.wanderT = rnd(3, 6);
  }
  if (e.path.n > 0 && e.path.i < e.path.n) followTo(e, e.path.x[e.path.n - 1], e.path.z[e.path.n - 1], def.speed * AI.patrolMul, dt, def);

}
function updateAlert(e, dt, def) {

/* Chasse : drone au contact, tank avec charge */
function updateChase(e, dt, def) {

    return;
  }
  const P = player;
  const dx = P.x - e.x, dz = P.z - e.z;
  const d = Math.hypot(dx, dz);
  if (e.type === 'drone') {
    if (d > 1.2) followTo(e, P.x, P.z, def.speed, dt, def);
    else idleMove(e, dt, def);
    faceTowards(e, P.x, P.z, dt);
    if (d <= AI.contactRange) damagePlayer(AI.contactDps * dt, e.x, e.z);

    if (e.sound <= 0 && d < 25) { e.sound = 1.2; playDroneBip(); }

    e.windT -= dt;

    if (e.windT <= 0) {

      e.chargeDZ = dz / len;

    if (isFinite(g)) e.feetY = g;
    if (d < def.bodyR + 0.7 && Math.abs(P.feetY - e.feetY) < 2) {
      damagePlayer(def.chargeDamage, e.x, e.z);
      P.kbX = e.chargeDX * def.knockback;

function updateSearch(e, dt, def) {
  if (e.seen) {

    return;
  }
  e.stateT -= dt;
  if (e.stateT <= 0) {
    setState(e, ST.PATROL, 0);
    return;
  }
  if (Math.hypot(e.lastX - e.x, e.lastZ - e.z) > 1.2) {
    followTo(e, e.lastX, e.lastZ, def.speed, dt, def);

}
/* Sentinelle : garde 12 à 18 m, tire toutes les 1,5 s, se met à couvert après un coup */
function updateSentinel(e, dt, def) {
  const P = player;
  if (e.cover) {
    if (e.hideT > 0) {
      e.hideT -= dt;
      idleMove(e, dt, def);
      faceTowards(e, P.x, P.z, dt);
      if (e.hideT <= 0) e.cover = false;
      return;
    }
    if (Math.hypot(e.coverX - e.x, e.coverZ - e.z) < 0.5) {
      e.hideT = AI.hideTime;
      idleMove(e, dt, def);
      return;
    }
    followTo(e, e.coverX, e.coverZ, def.speed * 1.5, dt, def);
    return;
  }
  if (!e.seen) {
    setState(e, ST.SEARCH, AI.memory);
    e.pathT = 0;
    return;
  }
  const dx = P.x - e.x, dz = P.z - e.z;
  const d = Math.hypot(dx, dz) || 1;
  faceTowards(e, P.x, P.z, dt);
  if (d > def.maxRange) {
    followTo(e, P.x, P.z, def.speed, dt, def);
  } else if (d < def.minRange) {
    moveTowards(e, e.x - (dx / d) * 4, e.z - (dz / d) * 4, def.speed, dt, def);
  } else {
    moveTowards(e, e.x - (dz / d) * 3 * e.strafe, e.z + (dx / d) * 3 * e.strafe, def.speed * 0.5, dt, def);

}
/* Titan : éventails et charges, un cycle de pause entre les actions */
/* Agent : strafe gauche-droite, rafales de trois tirs, garde 7 à 20 m */
function updateAgent(e, dt, def) {
  const P = player;
  if (!e.seen) {
    setState(e, ST.SEARCH, AI.memory);
    e.pathT = 0;
    e.burstLeft = 0;
    return;
  }
  const dx = P.x - e.x, dz = P.z - e.z;
  const d = Math.hypot(dx, dz) || 1;
  e.strafeT -= dt;
  if (e.strafeT <= 0) {
    e.strafe = -e.strafe;
    e.strafeT = rnd(def.strafeMin, def.strafeMax);
  }
  if (d > def.maxRange) {
    followTo(e, P.x, P.z, def.speed, dt, def);
  } else {
    const radial = d > 14 ? 0.6 : d < def.minRange ? -0.8 : 0;
    const tx = e.x + ((-dz / d) * e.strafe + (dx / d) * radial) * 3;
    const tz = e.z + ((dx / d) * e.strafe + (dz / d) * radial) * 3;
    moveTowards(e, tx, tz, def.speed * 0.85, dt, def);
  }
  e.yaw = Math.atan2(-dx, -dz);
  e.shootT -= dt;
  if (e.shootT <= 0 && e.burstLeft <= 0) {
    e.burstLeft = def.burst;
    e.burstT = 0;
    e.shootT = def.burstInterval;
  }
  if (e.burstLeft > 0) {
    e.burstT -= dt;
    if (e.burstT <= 0) {

      e.burstLeft--;
      e.burstT = def.burstGap;
    }
  }
}
function updateTitan(e, dt, def) {
  const P = player;

    e.stagger -= dt;
    idleMove(e, dt, def);
    faceTowards(e, P.x, P.z, dt);
    return;
  }
  const dx = P.x - e.x, dz = P.z - e.z;
  const d = Math.hypot(dx, dz) || 1;
  const speedMul = 1 + 0.2 * e.phase;
  if (e.act === 2) {
    e.chargeT -= dt;
    moveBox(e, e.chargeDX * def.chargeSpeed * speedMul * dt, e.chargeDZ * def.chargeSpeed * speedMul * dt, def.radius);
    const g = groundAt(e.x, e.z, def.radius * 0.8);
    if (isFinite(g)) e.feetY = g;
    if (d < def.bodyR + 0.5 && Math.abs(P.feetY - e.feetY) < 2.5) {
      damagePlayer(def.chargeDamage, e.x, e.z);
      P.kbX = e.chargeDX * 12;
      P.kbZ = e.chargeDZ * 12;
      e.chargeT = 0;
    }
    if (e.chargeT <= 0) {
      e.act = 0;
      e.cycleT = 1.5;
      e.nextCharge = false;
    }
    return;
  }
  if (e.act === 1) {
    faceTowards(e, P.x, P.z, dt);
    idleMove(e, dt, def);
    e.fanT -= dt;
    if (e.fanT <= 0) {
      titanFan(e, def);
      e.fanLeft--;
      e.fanT = def.fanInterval;
      if (e.fanLeft <= 0) {
        e.act = 0;
        e.cycleT = 1.2;
        e.nextCharge = true;
      }
    }
    return;
  }
  e.cycleT -= dt;
  faceTowards(e, P.x, P.z, dt);
  if (d > 7) followTo(e, P.x, P.z, def.speed * speedMul, dt, def);
  else idleMove(e, dt, def);
  if (e.cycleT > 0) return;
  if (e.nextCharge) {
    e.act = 2;
    e.chargeT = 2;
    e.chargeDX = dx / d;
    e.chargeDZ = dz / d;
    playRoar();
  } else {
    e.act = 1;
    e.fanLeft = def.fanVolleys[e.phase];
    e.fanT = 0;
  }
}
function applyEnemyVisuals(e, def) {
  const part = e.parts[e.type];
  const hoverY = e.type === 'drone' ? def.hover + Math.sin(e.hoverT += 0.1) * 0.05 : 0;
  e.hoverY = hoverY;
  e.root.position.set(e.x, e.feetY + hoverY, e.z);
  e.root.rotation.y = e.yaw;
  if (e.type === 'agent' && e.state !== ST.DISABLED) {
    const limbs = part.userData.limbs;
    const sp = Math.hypot(e.vx, e.vz);
    e.walkT += sp * CONFIG.loop.step * 2.4;
    const sw = Math.sin(e.walkT) * Math.min(1, sp / 3) * 0.75;
    limbs[0].rotation.x = sw;
    limbs[1].rotation.x = -sw;
  }
  part.scale.setScalar(def.scale);
  const dist = Math.hypot(player.x - e.x, player.z - e.z);
  e.root.visible = dist < CONFIG.render.cullDistance;
  const showBar = e.healthT > 0 && e.state !== ST.DISABLED && e.type !== 'titan';
  e.bar.visible = showBar && e.root.visible;
  if (showBar) {
    e.bar.position.set(e.x, e.feetY + def.headY + 0.5, e.z);
    e.bar.quaternion.copy(camera.quaternion);
    const f = clamp(e.hp / e.maxHp, 0, 1);
    e.fill.scale.x = Math.max(0.001, f);
    e.fill.position.x = -(1 - f) * 0.5;
  }
}

/* ================= Vagues ================= */
function spawnEnemy(type, s) {
  let e = null;
  for (const c of enemies) if (!c.alive) { e = c; break; }
  if (!e) return false;
  const def = CONFIG.enemies[type];
  e.alive = true;
  e.type = type;
  e.state = ST.PATROL;
  e.stateT = 0;
  e.x = clamp(s.x + rnd(-0.6, 0.6), O + 1, -O - 1);
  e.z = clamp(s.z + rnd(-0.6, 0.6), O + 1, -O - 1);
  const g = groundAt(e.x, e.z, def.radius * 0.8);
  e.feetY = isFinite(g) ? g : 0;
  e.yaw = Math.random() * Math.PI * 2;
  e.vx = 0; e.vz = 0;
  e.hp = def.hp; e.maxHp = def.hp;
  e.flashT = 0; e.healthT = 0; e.aiT = Math.random() * AI.senseInterval;
  e.spawnT = AI.spawnTime; e.dispT = 0; e.sparkT = 0;
  e.shootT = def.fireInterval ? rnd(0.5, 1.5) : 0;
  e.chargeCD = def.chargeInterval ? rnd(2, 4) : 0;
  e.chargeT = 0; e.windT = 0; e.cover = false; e.hideT = 0; e.seen = false;
  e.pathT = 0; e.goalI = -1; e.goalJ = -1; e.path.n = 0; e.path.i = 0;
  e.wanderT = rnd(0, 2); e.sound = rnd(0, 1); e.act = 0; e.cycleT = 1.5; e.nextCharge = false;
  e.strafe = Math.random() < 0.5 ? 1 : -1; e.sparkT = 0;
  e.fanLeft = 0; e.fanT = 0; e.phase = 0; e.stagger = 0; e.fade = 1; e.hoverT = Math.random() * 6;
  e.mats.body.color.setHex(TYPE_BODY[type]);
  e.mats.body.opacity = 1;
  e.mats.body.emissive.setRGB(0, 0, 0);
  e.mats.glow.color.setHex(def.glow);
  e.name = TYPE_NAMES[type];
  e.color = def.glow;
  if (type === 'agent') {
    const [name, col] = AGENTS[(Math.random() * AGENTS.length) | 0];
    e.name = name;
    e.color = col;
    e.mats.glow.color.setHex(col);
  }
  e.mats.glow.opacity = 1;
  e.mats.weak.opacity = 1;
  for (const t of ENEMY_TYPES) e.parts[t].visible = t === type;
  e.parts[type].rotation.set(0, 0, 0);
  e.parts[type].position.set(0, 0, 0);
  e.parts[type].scale.setScalar(def.scale * 0.05);
  e.root.visible = true;
  e.px = e.x; e.pz = e.z; e.pFeet = e.feetY; e.hoverY = 0;
  e.walkT = 0; e.burstLeft = 0; e.burstT = 0; e.strafeT = 0;
  return true;
}
function pickSpawnPoint() {
  const P = player;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  const n = spawns.enemies.length;
  for (let k = 0; k < n; k++) {
    const idx = (W.spawnIdx + k) % n;
    const s = spawns.enemies[idx];
    const dx = s.x - P.x, dz = s.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d < AI.spawnMinDist) continue;
    const inView = (fx * dx + fz * dz) / d > AI.fovCos;
    if (inView && !lineBlocked(P.x, P.feetY + P.eye, P.z, s.x, 1.2, s.z)) continue;
    W.spawnIdx = (idx + 1) % n;
    return s;
  }
  return null;
}
function nextQueuedType() {
  if (W.queue.titan > 0) return 'titan';
  if (W.queue.tank > 0) return 'tank';
  if (W.queue.agent > 0) return 'agent';
  if (W.queue.sentinel > 0) return 'sentinel';
  return 'drone';
}
function startWave() {
  W.n++;
  stats.wave = W.n;
  const n = W.n;
  const total = 5 + 2 * (n - 1);
  const titan = n % CONFIG.waves.titanEvery === 0 ? 1 : 0;
  const sentinel = n >= CONFIG.waves.sentinelFrom ? Math.floor((n - 1) / 2) : 0;
  const tank = n >= CONFIG.waves.tankFrom ? Math.floor((n - 3) / 2) : 0;
  W.queue.titan = titan;
  W.queue.tank = tank;
  W.queue.sentinel = sentinel;
  const agent = n >= CONFIG.waves.agentFrom ? Math.floor(n / 2) : 0;
  W.queue.agent = agent;
  W.queue.drone = total - titan - sentinel - tank - agent;
  W.state = 'spawn';
  W.spawnT = 0;
  showBanner('Vague ' + n + ' !');
}
function updateWaves(dt) {
  if (W.state === 'break') {
    W.timer -= dt;
    if (W.timer <= 0) startWave();
    return;
  }
  W.spawnT -= dt;
  if (queuedEnemies() > 0 && W.spawnT <= 0 && activeEnemies() < AI.maxActive) {
    const type = nextQueuedType();
    const s = pickSpawnPoint();
    if (s && spawnEnemy(type, s)) {
      W.queue[type]--;
      W.spawnT = CONFIG.waves.spawnGap;
    } else {
      W.spawnT = 0.25;
    }
  }
  if (queuedEnemies() === 0 && activeEnemies() === 0) {
    W.state = 'break';
    W.timer = CONFIG.waves.breakTime;
  }
}

const minimapCanvas = $('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
const minimapBase = document.createElement('canvas');
minimapBase.width = minimapCanvas.width;
minimapBase.height = minimapCanvas.height;
const MM_SCALE = minimapCanvas.width / (MAP_W * CELL);
const MM_COLORS = { [KIND.FLOOR]: '#0f1828', [KIND.WALL]: '#2a3140', [KIND.PLAT]: '#3c5a80',
  [KIND.BALC]: '#5a7fa8', [KIND.RAMP]: '#8a5a2a', [KIND.CRATE]: '#6d5b3e' };
function buildMinimapBase() {
  const ctx = minimapBase.getContext('2d');
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, minimapBase.width, minimapBase.height);
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      ctx.fillStyle = MM_COLORS[cellKind[r * MAP_W + c]];
      ctx.fillRect(c * CELL * MM_SCALE, r * CELL * MM_SCALE, CELL * MM_SCALE + 0.5, CELL * MM_SCALE + 0.5);
    }
  }
}
function updateMinimap() {
  const ctx = minimapCtx;
  ctx.drawImage(minimapBase, 0, 0);
  for (const p of pickups) {
    if (!p.alive) continue;
    ctx.fillStyle = p.type === 'repair' ? '#3dff9a' : p.type === 'shield' ? '#4fc3ff' : '#ffc23d';
    ctx.fillRect((p.x - O) * MM_SCALE - 2, (p.z - O) * MM_SCALE - 2, 4, 4);
  }
  for (const e of enemies) {
    if (!e.alive || e.state === ST.DISABLED) continue;
    ctx.fillStyle = e.type === 'titan' ? '#ff7bf0' : e.type === 'agent' ? '#3dfff0' : '#ff4d4d';
    const s = e.type === 'titan' ? 6 : 3;
    ctx.fillRect((e.x - O) * MM_SCALE - s / 2, (e.z - O) * MM_SCALE - s / 2, s, s);
  }
  const P = player;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  ctx.save();
  ctx.translate((P.x - O) * MM_SCALE, (P.z - O) * MM_SCALE);
  ctx.rotate(Math.atan2(fz, fx));
  ctx.fillStyle = '#9fd8ff';
  ctx.beginPath();
  ctx.moveTo(7, 0);
  ctx.lineTo(-5, 5);
  ctx.lineTo(-5, -5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

const hudCache = { shield: -1, hull: -1, mag: -1, reserve: -1, weapon: -1, score: -1, combo: '', wave: '', sub: '',
  left: '', reload: -1, spread: -1, vignette: -1, dirShown: false, boss: -1, fps: '' };
